name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:native

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm typecheck

      # Includes the Electron example test, which starts the built example.
      - run: pnpm test

      - run: pnpm exec publint packages/node-macos-disclaim

  build-test-native:
    name: Native addon build test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: arm64
          - runner: macos-26-intel
            target: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: TARGET_ARCH=${{ matrix.target }} pnpm build:native

      # Each runner loads the addon of its own architecture.
      - run: pnpm test:unit packages

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: packages/node-macos-disclaim/npm/darwin-*/disclaim.node

  test-other-platforms:
    name: No-op test on Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:unit packages
